name: CodeQL

# Enable push, pull_request, and schedule triggers when the repository becomes
# public, or when GitHub Advanced Security is enabled for the private repo.
on: workflow_dispatch

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
